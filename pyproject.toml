[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-prompt"
version = "0.1.0"
description = "Deterministic Spot DCA monthly accumulation prompt generator for downstream LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyperclip>=1.8.2",
    "click>=8.1.7",
    "jinja2>=3.1.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
spot-prompt = "spot_prompt.cli:main"

[tool.setuptools]
packages = ["spot_prompt"]

[tool.setuptools.package-data]
spot_prompt = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
